[project]
name = "gflownet"
version = "0.1.0"
description = "GFlowNets, generative flow networks for probabilistic modelling"
requires-python = ">=3.10,<3.11"
authors = [{ name = "Alex", email = "alex.hernandez-garcia@mila.quebec" }]
readme = "README.md"
dependencies = [
    "botorch>=0.10.0",
    "catkit",
    "dave",
    "dgl>=2.4.0",
    "e3nn>=0.5.1",
    "h5py>=3.14.0",
    "hydra-core>=1.3.2",
    "matgl==1.1.3",
    "matplotlib",
    "mendeleev<1.1",
    "numba>=0.61.2",
    "numpy<2",
    "ocpmodels",
    "orion>=0.2.7",
    "pandas",
    "plotly>=5.17.0",
    "pymatgen==2024.3.1",
    "pyshtools==4.10.3",
    "pytorch-warmup>=0.2.0",
    "pyxtal>=0.6.1",
    "rdkit==2023.3.1",
    "scikit-learn>=1.2.2",
    "scipy>=1.11.2",
    "six>=1.16.0",
    "torch==2.0.1",
    "torchani==2.2.4",
    "torchtyping>=0.1.4",
    "tqdm",
    "wandb>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
catkit = { git = "https://github.com/vict0rsch/CatKit.git" }
dave = { git = "https://github.com/sh-divya/ActiveLearningMaterials.git", rev = "0.3.4" }
pyg_lib = [{ index = "data_pyg" }]
torch_scatter = [{ index = "data_pyg" }]
torch_sparse = [{ index = "data_pyg" }]
torch_cluster = [{ index = "data_pyg" }]
torch_spline_conf = [{ index = "data_pyg" }]
dgl = [{ index = "data_dgl" }]
ocpmodels = { git = "https://github.com/RolnickLab/ocp", rev = "uncertainty" }

[[tool.uv.index]]
name = "data_pyg"
url = "https://data.pyg.org/whl/torch-2.2.0+cu118.html"
format = "flat"
explicit = true


[[tool.uv.index]]
name = "data_dgl"
url = "https://data.dgl.ai/wheels/torch-2.1/cu118/repo.html"
format = "flat"
explicit = true


[dependency-groups]
dev = [
    "black>=25.9.0",
    "flake8>=7.3.0",
    "ipdb>=0.13.13",
    "isort>=6.1.0",
    "jupyter>=1.1.1",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
    "pytest-repeat>=0.9.4",
]

[tool.uv.extra-build-dependencies]
torch_cluster = [{ requirement = "torch", match-runtime = true }]
torch-scatter = [{ requirement = "torch", match-runtime = true }]

[project]
name = "gflownet"
version = "0.1.0"
description = "GFlowNets, generative flow networks for probabilistic modelling"
requires-python = ">=3.10,<3.11"
authors = [{ name = "Alex", email = "alex.hernandez-garcia@mila.quebec" }]
readme = "README.md"
dependencies = [
    "botorch>=0.10.0",
    "hydra-core>=1.3.2",
    "matplotlib",
    "numpy<2",
    "pandas",
    "plotly>=5.17.0",
    "scikit-learn>=1.2.2",
    "scipy>=1.11.2",
    "six>=1.16.0",
    "torch==2.5.1",
    "torchtyping>=0.1.4",
    "tqdm",
    "wandb>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv]
# Use this to avoid building those from source (but you can also try if you want).
no-build-package = ["torch-spline-conv", "torch-scatter", "torch-cluster"]


[tool.uv.sources]
catkit = { git = "https://github.com/vict0rsch/CatKit.git" }
dave = { git = "https://github.com/sh-divya/crystalproxies.git", rev = "2.0.3" }
dgl = [{ index = "dgl_index" }]
ocpmodels = { git = "https://github.com/RolnickLab/ocp", rev = "uncertainty" }
pyg_lib = [{ index = "pyg_index" }]
torch_cluster = [{ index = "pyg_index" }]
torch_scatter = [{ index = "pyg_index" }]
torch_sparse = [{ index = "pyg_index" }]
torch_spline_conv = [{ index = "pyg_index" }]


[[tool.uv.index]]
name = "pyg_index"
url = "https://data.pyg.org/whl/torch-2.4.0+cu118.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "dgl_index"
url = "https://data.dgl.ai/wheels/torch-2.4/cu118/repo.html"
format = "flat"
explicit = true


[dependency-groups]
dev = [
    "black>=25.9.0",
    "flake8>=7.3.0",
    "ipdb>=0.13.13",
    "isort>=6.1.0",
    "jupyter>=1.1.1",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
    "pytest-repeat>=0.9.4",
]
materials = [
    "dave",
    "pymatgen>=2024.3.1",
    "pyshtools>=4.10.3",
    "torch-cluster>=1.6.3",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "torch-spline-conv>=1.2.2",
    "torchani>=2.2.4",
]
molecules = ["rdkit>=2023.3.1", "torch-geometric>=2.6.1", "torchani>=2.2.4"]
tree = ["torch-geometric>=2.6.1"]

# Uncomment these two blocks if you want to try to build these from source, for example for a different version of CUDA or pytorch.
[[tool.uv.dependency-metadata]]
name = "torch-spline-conv"
version = "1.2.2"
requires-dist = ["torch", "numpy"]

[[tool.uv.dependency-metadata]]
name = "torch-geometric"
version = "2.6.1"
requires-dist = ["torch"]


[tool.uv.extra-build-dependencies]
torch_cluster = [{ requirement = "torch", match-runtime = true }]
torch-scatter = [{ requirement = "torch", match-runtime = true }]
torch-spline-conv = [
    { requirement = "torch", match-runtime = true },
    { requirement = "numpy", match-runtime = true },
]

[project]
name = "gflownet"
version = "0.1.0"
description = "GFlowNets, generative flow networks for probabilistic modelling"
requires-python = ">=3.10,<3.11"
authors = [{ name = "Alex", email = "alex.hernandez-garcia@mila.quebec" }]
readme = "README.md"
dependencies = [
    "botorch>=0.10.0",
    "catkit",
    "dave",
    "dgl>=2.4.0",
    "e3nn>=0.5.1",
    "h5py>=3.14.0",
    "hydra-core>=1.3.2",
    "matgl==1.1.3",
    "matplotlib",
    "mendeleev<1.1",
    "numba>=0.61.2",
    "numpy<2",
    "ocpmodels",
    "orion>=0.2.7",
    "pandas",
    "plotly>=5.17.0",
    "pyg-lib",
    "pymatgen==2024.3.1",
    "pyshtools==4.10.3",
    "pytorch-warmup>=0.2.0",
    "pyxtal>=0.6.1",
    "rdkit==2023.3.1",
    "scikit-learn>=1.2.2",
    "scipy>=1.11.2",
    "six>=1.16.0",
    "torch==2.4.0",
    "torch-cluster",
    "torch-scatter>=2.1.2",
    "torch-sparse",
    "torch-spline-conv",
    "torchani==2.2.4",
    "torchtyping>=0.1.4",
    "tqdm",
    "wandb>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv]
no-build-package = ["torch-spline-conv", "torch-scatter", "torch-cluster"]


[tool.uv.sources]
catkit = { git = "https://github.com/vict0rsch/CatKit.git" }
dave = { git = "https://github.com/sh-divya/ActiveLearningMaterials.git", rev = "0.3.4" }
pyg_lib = [{ index = "pyg_index" }]
torch_scatter = [{ index = "pyg_index" }]
torch_sparse = [{ index = "pyg_index" }]
torch_cluster = [{ index = "pyg_index" }]
dgl = [{ index = "data_index" }]
ocpmodels = { git = "https://github.com/RolnickLab/ocp", rev = "uncertainty" }
torch_spline_conv = [{ index = "torch_spline_conv_index" }]


[[tool.uv.index]]
name = "pyg_index"
url = "https://data.pyg.org/whl/torch-2.4.0+cu118.html"
format = "flat"
explicit = true


[[tool.uv.index]]
name = "data_index"
url = "https://data.dgl.ai/wheels/torch-2.4/cu118/repo.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "torch_spline_conv_index"
url = "https://data.pyg.org/whl/torch-2.4.0+cu118.html"
format = "flat"
explicit = true

[dependency-groups]
dev = [
    "black>=25.9.0",
    "flake8>=7.3.0",
    "ipdb>=0.13.13",
    "isort>=6.1.0",
    "jupyter>=1.1.1",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
    "pytest-repeat>=0.9.4",
]


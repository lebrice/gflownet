[project]
name = "gflownet"
version = "0.1.0"
description = "GFlowNets, generative flow networks for probabilistic modelling"
authors = [
    {name = "alexhernandezgarcia", email = "alex.hernandez-garcia@mila.quebec"},
    {name = "AlexandraVolokhova"},
    {name = "nikita-0209"},
    {name = "michalkoziarski"},
    {name = "sh-divya"},
    {name = "carriepl"},
    {name = "vict0rsch"},
    {name = "josephdviviano"},
    {name = "engmubarak48"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "botorch >=0.10.0",
    "hydra-core >=1.3.2",
    "matplotlib",
    "numpy >=1.26.4,<2.0.0",
    "pandas",
    "plotly >=5.17.0",
    "pyro-ppl >=1.9.0",
    "scikit-learn >=1.2.2",
    "scipy >=1.11.2",
    "six >=1.16.0",
    "torch ==2.5.1",
    "torchtyping >=0.1.4",
    "tqdm",
    "wandb >=0.15.11",
]

[project.optional-dependencies]
dev = [
    "black >=23.9.1",
    "flake8 >=6.1.0",
    "isort >=5.12.0",
    "ipdb >=0.13.13",
    "jupyter >=1.0.0",
    "pylint >=2.17.6",
    "pytest >=7.4.2",
    "pytest-repeat >=0.9.1",
    "myst-nb >=1.4.0",
    "recommonmark >=0.7.1",
    "Sphinx >=8.1.3",
    "sphinx-autoapi >=3.8.0",
    "sphinx-autodoc-typehints >=3.0.1",
    "sphinx-code-include >=2.0.0",
    "sphinx-copybutton >=0.5.2",
    "sphinx-design >=0.6.1",
    "sphinx-math-dollar >=1.2.1",
    "sphinx-rtd-theme >=3.1.0",
    "sphinxext-opengraph >=0.13.0",
    "sphinx-markdown-tables >=0.0.17",
]

# TODO: Consider relaxing the == dependency of pymatgen. As of Feb 2025, the latest version
# is problematic. ==2024.3.1 is the minimum version required by pyxtal.
materials = [
    "dave",
    "pymatgen ==2024.3.1",
    "pyshtools >=4.10.3",
    "pyxtal >=0.6.1",
    "torch_scatter >=2.1.2",
]

# TODO: Dependencies in molecules should be further tested
molecules = [
    "rdkit ==2024.9.5",
    "torch-geometric >=2.6.1",
    "torchani >=2.2.4",
    "ultranest >=4.5.0",
]
tree = [
    "torch-geometric >=2.6.1",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.uv]
# torch_scatter ships prebuilt wheels on the PyG index (see [[tool.uv.index]] below);
# building it from source requires a matching nvcc/torch dev setup, so avoid it.
no-build-package = ["torch_scatter"]

[tool.uv.sources]
# PEP 508 direct references (`name @ git+...`) in [project.optional-dependencies] are
# not resolved by uv the same way pip does; use an explicit source instead. This also
# fixes the upstream URL, which had a typo (`github.com:` instead of `github.com/`).
dave = { git = "https://github.com/sh-divya/crystalproxies.git", rev = "2.0.6" }
torch_scatter = [{ index = "pyg_index" }]

[[tool.uv.index]]
# Prebuilt wheels matching torch==2.5.1's default PyPI build (bundles CUDA 12.4).
# If you install a different torch build (e.g. CPU-only or another CUDA version),
# point this at the matching index from https://data.pyg.org/whl/ instead.
name = "pyg_index"
url = "https://data.pyg.org/whl/torch-2.5.0+cu124.html"
format = "flat"
explicit = true
